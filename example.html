<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure HTML Tosi Product</title>
  <style>
    body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
    
    tosi-product-section {
      display: block;
      width: 100%;
      position: relative;
    }

    tosi-lottie, tosi-3d, tosi-map, video, tosi-filmstrip, img.bg {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      display: block !important;
    }

    .hero-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      font-weight: bold;
      text-align: center;
      margin: 0;
      pointer-events: none;
    }
  </style>

  <!-- Load dependencies via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tosijs-ui@1.0.6/dist/index.js"></script>
  
  <!-- Load tosijs-product local IIFE build -->
  <script src="./dist/index.js"></script>
</head>
<body>

  <!-- 
    The entire cinematic experience is defined purely in HTML. 
    No JavaScript is required to initialize or orchestrate the scroll animations.
  -->
  <tosi-product>
    
    <tosi-product-section scroll="2000">
      <tosi-lottie src="https://tosijs.net/tosi.json" data-scroll-animate="lottie" style="opacity: 0.5"></tosi-lottie>
      
      <!-- Declarative Text Interpolation -->
      <tosi-interpolator data-scroll-animate="interpolator">
        <tosi-waypoint progress="0.0" style="opacity: 0; transform: translateY(50px)"></tosi-waypoint>
        <tosi-waypoint progress="0.3" style="opacity: 1; transform: translateY(0px)"></tosi-waypoint>
        <tosi-waypoint progress="0.7" style="opacity: 1; transform: translateY(0px)"></tosi-waypoint>
        <tosi-waypoint progress="1.0" style="opacity: 0; transform: translateY(-50px)"></tosi-waypoint>
        <h1 class="hero-text">Pure HTML.<br>Zero JS Orchestration.</h1>
      </tosi-interpolator>
    </tosi-product-section>

    <tosi-product-section scroll="2000" style="background: #111;">
      <!-- Declarative Image Interpolation -->
      <tosi-interpolator data-scroll-animate="interpolator">
        <tosi-waypoint progress="0.0" style="transform: scale(1.0); opacity: 0.2;"></tosi-waypoint>
        <tosi-waypoint progress="0.5" style="transform: scale(2.0); opacity: 1.0;"></tosi-waypoint>
        <tosi-waypoint progress="1.0" style="transform: scale(0.5); opacity: 0.2;"></tosi-waypoint>
        <img class="bg" src="https://tosijs.net/favicon.svg" style="object-fit: contain !important;">
      </tosi-interpolator>

      <tosi-interpolator data-scroll-animate="interpolator">
        <tosi-waypoint progress="0.0" style="opacity: 0; transform: scale(0.5)"></tosi-waypoint>
        <tosi-waypoint progress="0.5" style="opacity: 1; transform: scale(1)"></tosi-waypoint>
        <tosi-waypoint progress="1.0" style="opacity: 0; transform: scale(1.5)"></tosi-waypoint>
        <h1 class="hero-text" style="color: #4ade80;">Declarative CSS Animation</h1>
      </tosi-interpolator>
    </tosi-product-section>

    <div style="height: 50vh; display: flex; align-items: center; justify-content: center; background: #000;">
      <h2>End of Demo</h2>
    </div>

  </tosi-product>

  <script>
    // Just ensure the components are registered from the IIFE namespaces
    const { markdownViewer, bodymovinPlayer } = TosiUi;
    bodymovinPlayer(); // Register tosi-lottie
  </script>
</body>
</html>
